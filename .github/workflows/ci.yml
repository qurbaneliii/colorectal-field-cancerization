name: CI

on:
  push:
  pull_request:

jobs:
  unit-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff check src scripts tests
      - run: python -m pytest -q -m "not full_data"
      - run: python scripts/run_synthetic_smoke_test.py
      - name: Parse configuration and documentation
        run: python -c "import pathlib,yaml; yaml.safe_load(pathlib.Path('config/analysis.yaml').read_text()); yaml.safe_load(pathlib.Path('config/paths.yaml').read_text()); assert pathlib.Path('README.md').read_text().strip()"
