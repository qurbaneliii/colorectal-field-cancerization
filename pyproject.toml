[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colorectal-field-cancerization"
version = "0.1.0"
description = "Leakage-safe transcriptomic field-cancerization analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.4.4",
  "pandas==3.0.3",
  "scipy==1.17.1",
  "scikit-learn==1.8.0",
  "matplotlib==3.10.9",
  "seaborn==0.13.2",
  "PyYAML==6.0.3",
  "pyarrow==20.0.0",
  "joblib==1.5.3",
  "statsmodels==0.14.4",
  "tabulate==0.9.0",
]

[project.optional-dependencies]
explain = ["shap==0.52.0", "xgboost==3.1.2"]
test = ["pytest==8.4.1", "ruff==0.12.7"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "full_data: requires the local multi-gigabyte GEO inputs or generated full-data artifacts",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
